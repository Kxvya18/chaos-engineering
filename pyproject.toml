[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosctl"
version = "0.1.0"
description = "AI-assisted, safety-first chaos engineering for the OpenTelemetry Demo (Bosch hackathon)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["anthropic>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.8"]

[project.scripts]
chaosctl = "chaosctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
